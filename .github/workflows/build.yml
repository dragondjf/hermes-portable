name: build-portable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      hermes_ref:
        description: 'hermes-agent SOURCE ref to package: a commit SHA or release tag (v0.21.6+ semver, or v2026.9.24 date-style). Leave EMPTY to use the HERMES_REF file at repo root (final fallback: latest main). NOTE: this is NOT the packaging version number.'
        required: false
        default: ''
      version_label:
        description: 'Human label for the release asset (e.g. 0.20.0). Empty = derived from tag.'
        required: false
        default: ''

permissions:
  contents: write   # needed to upload release assets

jobs:
  # ---------------------------------------------------------------------------
  # Linux (x64 + arm64) and macOS — official installer + repackage.
  # ---------------------------------------------------------------------------
  unix:
    name: ${{ matrix.runner }} (${{ matrix.arch }}) py${{ matrix.py }}
    strategy:
      fail-fast: false
      matrix:
        # Single py per platform, pinned to the official PM runtime era.
        # hermes v0.21.x installs its dependency env on Python 3.14
        # (pm/lock.json) and its dep pins carry python_version >= '3.14'
        # markers, so only a 3.14 bundle reproduces the official dep set.
        include:
          - runner: ubuntu-22.04
            arch: x64
            py: '3.14'
          - runner: ubuntu-22.04-arm
            arch: arm64
            py: '3.14'
          - runner: macos-latest
            arch: x64
            py: '3.14'
    runs-on: ${{ matrix.runner }}
    env:
      HERMES_HOME: ${{ github.workspace }}/official-hermes
      PY_VER: ${{ matrix.py }}
    steps:
      - name: Checkout this packaging repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (base for uv) + uv
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.3'

      - name: Official install (curl install.sh)
        shell: bash
        env:
          HERMES_HOME: ${{ env.HERMES_HOME }}
        run: |
          # Pin to a real hermes-agent source ref: the workflow_dispatch input
          # when given, else the HERMES_REF file committed at repo root (so v*
          # tag builds are reproducible instead of tracking hermes main; the
          # installer verifies the ref is on main via merge-base --is-ancestor).
          REF="${{ github.event.inputs.hermes_ref }}"
          if [ -z "$REF" ] && [ -f HERMES_REF ]; then
            REF="$(tr -d '[:space:]' < HERMES_REF)"
          fi
          COMMIT_ARG=""
          [ -n "$REF" ] && COMMIT_ARG="--commit $REF"
          echo "==> hermes-agent source ref: ${REF:-latest main}"
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh \
            | bash -s -- --hermes-home "$HERMES_HOME" $COMMIT_ARG --skip-setup --skip-browser

      - name: Repackage into portable bundle
        shell: bash
        env:
          HERMES_HOME: ${{ env.HERMES_HOME }}
          OUT: ${{ github.workspace }}/hermes-portable
        run: |
          # Job-log download needs admin rights, so surface the failure tail as
          # a workflow annotation (visible on the public run page) on error.
          set -o pipefail
          bash build/build_portable.sh 2>&1 | tee "$RUNNER_TEMP/build_portable.log" || {
            MSG="$(tail -c 6000 "$RUNNER_TEMP/build_portable.log" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::error title=build_portable.sh failed (log tail)::${MSG}"
            exit 1
          }

      - name: Smoke test (install + version, offline)
        shell: bash
        run: |
          # Run on a COPY so the built artifact stays tokenized (zero absolute
          # paths). install.sh de-tokenizes the package it runs on; running it
          # in-place would leak the build path into the published tarball and
          # break the relocatability check below.
          rm -rf smoke-test && cp -a hermes-portable smoke-test
          cd smoke-test
          bash install.sh
          bash hermes.sh version

      - name: Green-package verification (relocatable + offline + isolated)
        shell: bash
        run: |
          # TRUE green check: copy out of the build dir, run with a wiped env,
          # assert correct deploy path, no external network, no system-dir writes.
          bash build/verify_reloc.sh "$(pwd)/hermes-portable"

      - name: Package artifact
        shell: bash
        run: |
          tar czf "hermes-portable-${{ matrix.runner }}-${{ matrix.arch }}-py${{ matrix.py }}.tar.gz" hermes-portable

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: hermes-portable-${{ matrix.runner }}-${{ matrix.arch }}-py${{ matrix.py }}.tar.gz
          overwrite: true

  # ---------------------------------------------------------------------------
  # Windows.
  # ---------------------------------------------------------------------------
  windows:
    name: windows-latest (x64) py${{ matrix.py }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # py pinned to the official PM runtime era (hermes v0.21.x = 3.14).
        include:
          - py: '3.14'
    env:
      HERMES_HOME: ${{ github.workspace }}\official-hermes
      PY_VER: ${{ matrix.py }}
    steps:
      - name: Checkout this packaging repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (base for uv) + uv
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.3'

      - name: Official install (iex install.ps1)
        shell: pwsh
        env:
          HERMES_HOME: ${{ env.HERMES_HOME }}
        run: |
          # Pin to a real hermes-agent source ref: the workflow_dispatch input
          # when given, else the HERMES_REF file committed at repo root (so v*
          # tag builds are reproducible instead of tracking hermes main; the
          # installer verifies the ref is on main via merge-base --is-ancestor).
          $ref = "${{ github.event.inputs.hermes_ref }}".Trim()
          if (-not $ref -and (Test-Path HERMES_REF)) {
            $ref = (Get-Content HERMES_REF -Raw).Trim()
          }
          Write-Host "==> hermes-agent source ref: $(if ($ref) { $ref } else { 'latest main' })"
          # NOTE: download the installer to a file and invoke it with `&` — `iex (irm ...) -Arg`
          # passes -Arg to iex (which has no such param) and fails.
          # Official installer reads HERMES_HOME from the env (workflow sets it),
          # so we only pass -SkipSetup (+ -Commit when pinning).
          $installPs1 = Join-Path $env:TEMP "hermes-install.ps1"
          irm https://hermes-agent.nousresearch.com/install.ps1 -OutFile $installPs1
          if ($ref) { & $installPs1 -Commit $ref -SkipSetup }
          else      { & $installPs1 -SkipSetup }

      - name: Repackage into portable bundle
        shell: pwsh
        env:
          HERMES_HOME: ${{ env.HERMES_HOME }}
          OUT: ${{ github.workspace }}\hermes-portable
          SCRIPT_DIR: ${{ github.workspace }}\build
        run: |
          # Job-log download needs admin rights, so surface the failure tail as
          # a workflow annotation (visible on the public run page) on error.
          pwsh build/build_portable.ps1 *>&1 | Tee-Object -FilePath "$env:TEMP\build_portable.log"
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content "$env:TEMP\build_portable.log" -Tail 60 | ForEach-Object { $_ -replace '%', '%25' }) -join '%0A'
            Write-Host "::error title=build_portable.ps1 failed (log tail)::$tail"
            exit 1
          }

      - name: Smoke test (install + version, offline)
        shell: pwsh
        run: |
          # Run on a COPY so the built artifact stays tokenized. install.ps1
          # de-tokenizes the package it runs on; in-place would leak the build
          # path into the published zip and break the relocatability check.
          Remove-Item smoke-test -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Recurse -Force hermes-portable smoke-test
          cd smoke-test
          pwsh install.ps1
          pwsh hermes.ps1 version

      - name: Green-package verification (relocatable + offline + isolated)
        shell: pwsh
        run: |
          # TRUE green check on Windows: copy to a temp path, run with a wiped
          # env, assert correct deploy path, and that no build-machine path leaked.
          pwsh build/verify_reloc.ps1 -PackageDir "$(Get-Location)/hermes-portable"

      - name: Package artifact
        shell: pwsh
        run: |
          Compress-Archive -Path hermes-portable -DestinationPath "hermes-portable-windows-latest-x64-py${{ matrix.py }}.zip"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: hermes-portable-windows-latest-x64-py${{ matrix.py }}.zip
          overwrite: true
